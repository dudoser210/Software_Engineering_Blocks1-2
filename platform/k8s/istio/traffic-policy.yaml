apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: unieats
  namespace: unieats
spec:
  selector: {istio: ingressgateway}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: unieats
  namespace: unieats
spec:
  hosts: ["*"]
  gateways: [unieats]
  http:
    - match: [{uri: {prefix: /api/identity/}}]
      rewrite: {uri: /}
      route: [{destination: {host: identity-service, port: {number: 8001}}}]
      retries: &retries {attempts: 3, perTryTimeout: 1s, retryOn: "connect-failure,reset,5xx"}
    - match: [{uri: {prefix: /api/catalog/}}]
      rewrite: {uri: /}
      route: [{destination: {host: catalog-service, port: {number: 8002}}}]
      retries: *retries
    - match: [{uri: {prefix: /api/orders/}}]
      rewrite: {uri: /}
      route: [{destination: {host: order-service, port: {number: 8003}}}]
      retries: *retries
      timeout: 5s
    - match: [{uri: {prefix: /api/kitchen/}}]
      rewrite: {uri: /}
      route: [{destination: {host: kitchen-service, port: {number: 8004}}}]
      retries: *retries
    - match: [{uri: {prefix: /api/notifications/}}]
      rewrite: {uri: /}
      route: [{destination: {host: notification-service, port: {number: 8005}}}]
      retries: *retries
    - match: [{uri: {prefix: /api/analytics/}}]
      rewrite: {uri: /}
      route: [{destination: {host: analytics-service, port: {number: 8006}}}]
      retries: *retries
    - directResponse:
        status: 404
        body: {string: "route not found"}
---
# Одинаковая политика применяется к HTTP-сервисам; правила выписаны явно для аудита.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: order-service, namespace: unieats}
spec:
  host: order-service
  trafficPolicy:
    connectionPool:
      tcp: {maxConnections: 100}
      http: {http1MaxPendingRequests: 50, maxRequestsPerConnection: 20}
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: catalog-service, namespace: unieats}
spec:
  host: catalog-service
  trafficPolicy:
    connectionPool:
      tcp: {maxConnections: 100}
      http: {http1MaxPendingRequests: 50}
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
