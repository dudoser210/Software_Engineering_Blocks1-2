apiVersion: v1
kind: ConfigMap
metadata: {name: keepalived-config, namespace: edge}
data:
  keepalived.conf: |
    vrrp_script check_haproxy {
      script "/bin/sh -c 'nc -z 127.0.0.1 80'"
      interval 2
      fall 2
      rise 2
    }
    vrrp_instance CAMPUS_VIP {
      state BACKUP
      interface eth0
      virtual_router_id 51
      priority 100
      advert_int 1
      authentication {
        auth_type PASS
        auth_pass uni42
      }
      virtual_ipaddress {
        192.168.49.250/24
      }
      track_script { check_haproxy }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: keepalived, namespace: edge}
spec:
  selector: {matchLabels: {app: keepalived}}
  template:
    metadata: {labels: {app: keepalived}}
    spec:
      hostNetwork: true
      containers:
        - name: keepalived
          image: alpine:3.21
          securityContext:
            privileged: true
            capabilities: {add: [NET_ADMIN, NET_BROADCAST, NET_RAW]}
          command: [/bin/sh, -ec]
          args:
            - apk add --no-cache keepalived netcat-openbsd && keepalived --dont-fork --log-console --config /etc/keepalived/keepalived.conf
          volumeMounts:
            - {name: config, mountPath: /etc/keepalived/keepalived.conf, subPath: keepalived.conf}
      volumes:
        - name: config
          configMap: {name: keepalived-config}

