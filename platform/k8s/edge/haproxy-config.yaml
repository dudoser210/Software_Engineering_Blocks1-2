apiVersion: v1
kind: ConfigMap
metadata: {name: haproxy-config, namespace: edge}
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 4096
    defaults
      log global
      mode http
      option httplog
      timeout connect 3s
      timeout client 30s
      timeout server 30s
    frontend uni_http
      bind *:80
      default_backend istio_gateway
    backend istio_gateway
      balance roundrobin
      option httpchk GET /healthz/ready
      server istio istio-ingress.istio-ingress.svc.cluster.local:80 check resolvers kube
    resolvers kube
      parse-resolv-conf
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s
      hold valid 10s
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: haproxy-edge, namespace: edge}
spec:
  selector: {matchLabels: {app: haproxy-edge}}
  template:
    metadata: {labels: {app: haproxy-edge}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports: [{name: http, containerPort: 80, hostPort: 80}]
          volumeMounts:
            - {name: config, mountPath: /usr/local/etc/haproxy/haproxy.cfg, subPath: haproxy.cfg}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
      volumes:
        - name: config
          configMap: {name: haproxy-config}

