apiVersion: v1
kind: ConfigMap
metadata:
  name: unieats-platform-dashboard
  namespace: observability
  labels: {grafana_dashboard: "1"}
data:
  unieats.json: |
    {
      "title": "UniEats Platform",
      "uid": "unieats-platform",
      "schemaVersion": 39,
      "refresh": "10s",
      "panels": [
        {"type":"timeseries","title":"Istio request rate","targets":[{"expr":"sum(rate(istio_requests_total{destination_workload_namespace=\"unieats\"}[1m])) by (destination_workload)"}],"gridPos":{"h":8,"w":12,"x":0,"y":0}},
        {"type":"timeseries","title":"p95 latency, ms","targets":[{"expr":"histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=\"unieats\"}[5m])) by (le,destination_workload))"}],"gridPos":{"h":8,"w":12,"x":12,"y":0}},
        {"type":"timeseries","title":"Kafka consumer lag","targets":[{"expr":"max(kafka_consumergroup_lag) by (consumergroup,topic)"}],"gridPos":{"h":8,"w":12,"x":0,"y":8}},
        {"type":"stat","title":"Rate-limit rejections","targets":[{"expr":"sum(increase(envoy_http_ratelimit_over_limit[5m]))"}],"gridPos":{"h":8,"w":6,"x":12,"y":8}},
        {"type":"stat","title":"5xx responses","targets":[{"expr":"sum(rate(istio_requests_total{response_code=~\"5..\",destination_workload_namespace=\"unieats\"}[5m]))"}],"gridPos":{"h":8,"w":6,"x":18,"y":8}}
      ]
    }

