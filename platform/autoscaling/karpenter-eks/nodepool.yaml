# Cloud-ready пример. Он не применяется App of Apps в локальном Minikube.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: unieats-workers}
spec:
  template:
    spec:
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: karpenter.k8s.aws/instance-category, operator: In, values: [t, m]}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: unieats
      expireAfter: 720h
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: {name: unieats}
spec:
  role: REPLACE_WITH_KARPENTER_NODE_ROLE
  amiSelectorTerms: [{alias: al2023@latest}]
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]

