---
- name: Ensure Kafka namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ strimzi_namespace }}"

- name: Add Strimzi Helm repository
  kubernetes.core.helm_repository:
    name: strimzi
    repo_url: https://strimzi.io/charts/

- name: Install Strimzi Cluster Operator
  kubernetes.core.helm:
    name: strimzi-cluster-operator
    chart_ref: strimzi/strimzi-kafka-operator
    chart_version: "{{ strimzi_chart_version }}"
    release_namespace: "{{ strimzi_namespace }}"
    create_namespace: true
    wait: true
    values:
      watchAnyNamespace: false

- name: Wait for Strimzi operator
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ strimzi_namespace }}"
    name: strimzi-cluster-operator
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Deploy KRaft Kafka cluster and topics
  kubernetes.core.k8s:
    state: present
    template: kafka.yaml.j2

