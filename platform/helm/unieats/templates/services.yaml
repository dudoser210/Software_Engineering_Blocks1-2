{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
    {{- include "unieats.labels" $ | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels: {app: {{ $name }}-service}
  template:
    metadata:
      labels:
        app: {{ $name }}-service
        version: v1
        app.kubernetes.io/part-of: unieats
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: /stats/prometheus
    spec:
      serviceAccountName: {{ $name }}-service
      containers:
        - name: application
          image: "{{ $.Values.global.image.repository }}:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            - {name: SERVICE_MODULE, value: {{ $service.module | quote }}}
            - {name: PORT, value: {{ $service.port | quote }}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: {{ $.Values.global.kafkaBootstrapServers | quote }}}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: unieats-database, key: POSTGRES_DSN}
            - name: MONGO_URL
              valueFrom:
                secretKeyRef: {name: unieats-database, key: MONGO_URL}
            - {name: REDIS_URL, value: {{ $.Values.global.redisUrl | quote }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  labels: {app: {{ $name }}-service}
spec:
  selector: {app: {{ $name }}-service}
  ports:
    - {name: http, port: {{ $service.port }}, targetPort: http}
{{- if and $.Values.autoscaling.enabled (or (eq $name "catalog") (eq $name "order")) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
