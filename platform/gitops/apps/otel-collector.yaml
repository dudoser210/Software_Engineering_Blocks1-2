apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: otel-collector, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.129.0
    helm:
      values: |
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib
        config:
          receivers:
            otlp:
              protocols: {grpc: {}, http: {}}
            filelog:
              include: [/var/log/pods/*/*/*.log]
              start_at: end
          processors:
            batch: {}
            memory_limiter: {check_interval: 1s, limit_mib: 256}
          exporters:
            otlp/tempo:
              endpoint: tempo.observability.svc.cluster.local:4317
              tls: {insecure: true}
            otlphttp/loki:
              endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp/tempo]
              logs:
                receivers: [filelog, otlp]
                processors: [memory_limiter, batch]
                exporters: [otlphttp/loki]
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

