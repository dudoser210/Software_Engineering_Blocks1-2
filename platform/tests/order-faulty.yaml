# Временный заведомо неисправный endpoint входит в selector order-service.
# Istio должен обнаружить повторные 5xx и исключить его согласно DestinationRule.
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service-faulty, namespace: unieats}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service, version: faulty}}
  template:
    metadata:
      labels: {app: order-service, version: faulty}
    spec:
      containers:
        - name: faulty
          image: mendhak/http-https-echo:35
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: HTTP_RESPONSE_CODE, value: "500"}
          ports: [{name: http, containerPort: 8080}]

