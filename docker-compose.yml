name: unieats

x-service: &python-service
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  environment: &common-env
    POSTGRES_DSN: postgresql://${POSTGRES_USER:-uni}:${POSTGRES_PASSWORD:-uni_dev_password}@postgres:5432/${POSTGRES_DB:-unieats}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_URL: redis://valkey:6379
    MONGO_URL: mongodb://${MONGO_USER:-uni}:${MONGO_PASSWORD:-uni_dev_password}@mongo:27017
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  networks: [uni-net]

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - order-service-a
      - order-service-b
      - kitchen-service
      - notification-service
      - analytics-service
    networks: [uni-net]

  identity-service:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: identity
      PORT: 8001
    ports: ["8001:8001"]

  catalog-service:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: catalog
      PORT: 8002
    ports: ["8002:8002"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Два экземпляра одного логического микросервиса показывают балансировку round-robin.
  order-service-a:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: order
      PORT: 8003
    ports: ["8003:8003"]

  order-service-b:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: order
      PORT: 8003
    ports: ["8013:8003"]

  kitchen-service:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: kitchen
      PORT: 8004
    ports: ["8004:8004"]

  notification-service:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: notification
      PORT: 8005
    ports: ["8005:8005"]
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  analytics-service:
    <<: *python-service
    environment:
      <<: *common-env
      SERVICE_MODULE: analytics
      PORT: 8006
    ports: ["8006:8006"]
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uni_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-unieats}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni} -d ${POSTGRES_DB:-unieats}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [uni-net]

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-uni}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-uni_dev_password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [uni-net]

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [uni-net]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [uni-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [uni-net]

networks:
  uni-net:

volumes:
  postgres-data:
  mongo-data:
  valkey-data:
  kafka-data: